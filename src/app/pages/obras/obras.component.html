<div *ngIf="!isLoading && !hasError" class="obras-container">
    <breadcrumb title="Galeria"></breadcrumb>

    <div class="galeria-container">
        <div *ngFor="let obra of lightboxImagemViewModel">
            <img [src]="obra.imageUrl" />
            <div class="card-lightbox" [id]="obra.id" (click)="onClickImagem(obra)">
                Clique para visualizar
            </div>
        </div>
        <lightbox [imagens]="lightboxImagemViewModel" [imagemSelecionada]="imagemSelecionada"  (onPrevious)="previous($event)" (onNext)="next($event)"></lightbox>
    </div>
</div>

<div *ngIf="hasError">
    <error-message></error-message>
</div>

<div *ngIf="isLoading">
    <mat-spinner></mat-spinner>
</div>
