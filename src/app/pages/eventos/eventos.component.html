<section class="main" *ngIf="!isLoading && !hasError">
    <breadcrumb title="Eventos" strokeColor="1px white" backUrl="/eventos" whereAmI="Home > Eventos"></breadcrumb>
    <section class="eventos">
        <div class="row">
            <div class="col-md-12 col-lg-6" *ngFor="let item of eventoContainerViewModel" style="margin-bottom: 40px;">
                <mat-card class="example-card" appearance="outlined">
                    <img mat-card-image [src]="item.Evento.ImageUrl" alt="Photo of a Shiba Inu">
                    <mat-card-content>
                        <h5>{{ item.Evento.Title }}</h5>
                        <p>
                            {{ item.Evento.Description }}
                        </p>
                    </mat-card-content>
                    <mat-card-actions>
                        <button mat-button (click)="selecionarEvento(item.Id)">Leia mais</button>
                    </mat-card-actions>
                </mat-card>
            </div>
        </div>        
    </section>    
</section>

<div *ngIf="hasError">
    <error-message></error-message>
</div>

<div *ngIf="isLoading">
    <mat-spinner></mat-spinner>
</div>
