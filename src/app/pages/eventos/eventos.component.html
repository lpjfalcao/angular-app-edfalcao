<section class="main">
    <breadcrumb title="Eventos" strokeColor="1px white"></breadcrumb>
    <section class="eventos">
        <div class="row">
            <div class="col-md-12 col-lg-6" *ngFor="let item of eventosViewModel" style="margin-bottom: 40px;">
                <mat-card class="example-card" appearance="outlined">
                    <img mat-card-image [src]="item.imagemUrl" alt="Photo of a Shiba Inu">
                    <mat-card-content>
                        <h5>{{ item.titulo }}</h5>
                        <p>
                            {{ item.descricao }}
                        </p>
                    </mat-card-content>
                    <mat-card-actions>
                        <button mat-button>Leia mais</button>
                    </mat-card-actions>
                </mat-card>
            </div>
        </div>        
    </section>    
</section>
