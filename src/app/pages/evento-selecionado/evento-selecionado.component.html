<!-- <message-box></message-box> -->

<section class="main" *ngIf="!isLoading && !hasError">
    <breadcrumb [title]="eventoSelecionadoViewModel.Evento.Title" strokeColor="1px white" whereAmI="Home > Eventos">
    </breadcrumb>

    <div class="main-grid">
        <div class="main-grid-left">
            <div class="flex-container-imagem">
                <img [src]="eventoSelecionadoViewModel.Evento.ImageUrl"  />                               
            </div>

            <section class="text-section">
                <p [innerHTML]="eventoSelecionadoViewModel.Evento.Description">

                </p>
            </section>

            <section class="hide-on-small">
                <h1>Fotos</h1>
                <owl-carousel [carouselViewModel]="carouselItems" [quantidadeItemsMobile]="1" [quantidadeItens]="3"
                    [mostrarIndicadores]="true"></owl-carousel>
            </section>

            <!-- <section class="hide-on-small">
                <h1>Vídeos</h1>
                <owl-carousel [carouselViewModel]="carouselItems" [quantidadeItemsMobile]="1" [quantidadeItens]="3"
                    [mostrarIndicadores]="true"></owl-carousel>
            </section> -->
        </div>
        <div class="main-grid-right">
            <aside class="exhibition-layout__events">
                <app-event-list [events]="events" title="Agenda de Eventos">
                </app-event-list>
            </aside>            
        </div>
    </div>
</section>

<div *ngIf="hasError">
    <error-message></error-message>
</div>

<div *ngIf="isLoading">
    <mat-spinner></mat-spinner>
</div>
