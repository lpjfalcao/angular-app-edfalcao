<div class="breadcrumb-container">
    <div matRipple [matRippleUnbounded]="true" [matRippleCentered]="true" [matRippleRadius]="25">
        <a routerLink="/home">
            <span class="material-symbols-outlined left-arrow-icon">
                arrow_left_alt
            </span>
        </a>
    </div>
    <div id="label-galeria">
        <span class="texto-em-destaque" [ngStyle]="{'-webkit-text-stroke': strokeColor}">{{ title }}</span>
    </div>
</div>
